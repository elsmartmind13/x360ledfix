plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.alisa.x360ledfix'
    compileSdk 34
    ndkVersion '26.1.10909125'

    defaultConfig {
        applicationId 'ru.alisa.x360ledfix'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            // отладочная подпись ставится автоматически
        }
    }
}
